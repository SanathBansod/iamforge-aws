<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#102a44"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#35dff3"/></marker></defs><rect width="1400" height="660" rx="26" fill="url(#bg)"/><text x="58" y="62" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#44e4ff">IDENTITY HARDENING MAP</text><text x="58" y="99" font-family="Arial,sans-serif" font-size="17" fill="#c4d9eb">Two tracks: protect the account owner, then provision daily-use identity with scoped permissions.</text><rect x="55" y="145" width="610" height="440" rx="20" fill="#0d2035" stroke="#1c5772" stroke-width="2"/><rect x="735" y="145" width="610" height="440" rx="20" fill="#0d2035" stroke="#383f79" stroke-width="2"/><text x="85" y="187" font-family="Arial,sans-serif" font-size="20" fill="#55e8ff" font-weight="700">TRACK A / ROOT MFA</text><text x="765" y="187" font-family="Arial,sans-serif" font-size="20" fill="#a9b8ff" font-weight="700">TRACK B / IAM USER</text><g font-family="Arial,sans-serif" font-size="17" fill="#edf7ff"><rect x="92" y="215" width="530" height="58" rx="12" fill="#132f4a" stroke="#2bdcf5"/><text x="357" y="250" text-anchor="middle">01  Root sign-in</text><path d="M357 273V303" stroke="#35dff3" stroke-width="3" marker-end="url(#arr)"/><rect x="92" y="310" width="530" height="58" rx="12" fill="#132f4a" stroke="#2bdcf5"/><text x="357" y="345" text-anchor="middle">02  Select authenticator method</text><path d="M357 368V398" stroke="#35dff3" stroke-width="3" marker-end="url(#arr)"/><rect x="92" y="405" width="530" height="58" rx="12" fill="#132f4a" stroke="#2bdcf5"/><text x="357" y="440" text-anchor="middle">03  Register virtual MFA device</text><path d="M357 463V493" stroke="#35dff3" stroke-width="3" marker-end="url(#arr)"/><rect x="92" y="500" width="530" height="58" rx="12" fill="#123f42" stroke="#31ebbc"/><text x="357" y="535" text-anchor="middle">04  Verify sign-in challenge</text><rect x="772" y="215" width="530" height="58" rx="12" fill="#1b2349" stroke="#9b9eff"/><text x="1037" y="250" text-anchor="middle">01  Inspect current IAM users</text><path d="M1037 273V303" stroke="#9b9eff" stroke-width="3" marker-end="url(#arr)"/><rect x="772" y="310" width="530" height="58" rx="12" fill="#1b2349" stroke="#9b9eff"/><text x="1037" y="345" text-anchor="middle">02  Create test identity</text><path d="M1037 368V398" stroke="#9b9eff" stroke-width="3" marker-end="url(#arr)"/><rect x="772" y="405" width="530" height="58" rx="12" fill="#1b2349" stroke="#9b9eff"/><text x="1037" y="440" text-anchor="middle">03  Review least-privilege policy</text><path d="M1037 463V493" stroke="#9b9eff" stroke-width="3" marker-end="url(#arr)"/><rect x="772" y="500" width="530" height="58" rx="12" fill="#123f42" stroke="#31ebbc"/><text x="1037" y="535" text-anchor="middle">04  Confirm user / review user MFA</text></g><text x="700" y="625" font-family="Arial,sans-serif" font-size="14" fill="#8fb4d1" text-anchor="middle">Training lab • screenshots are evidence of console steps, not an automated security audit</text></svg>